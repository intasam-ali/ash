<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Mobile | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; padding-bottom: 80px; }
        .mobile-header {
            background: #111827; color: white; padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mobile-header .logo { font-size: 20px; font-weight: 900; }
        .mobile-header .logo span { color: #7c3aed; }
        .mobile-header a { color: #94a3b8; text-decoration: none; font-size: 14px; }
        .mobile-container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .mobile-stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-bottom: 20px;
        }
        .mobile-stat {
            background: white; border-radius: 12px; padding: 15px;
            text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .mobile-stat .num { font-size: 24px; font-weight: 900; color: #111827; display: block; }
        .mobile-stat .label { font-size: 11px; color: #94a3b8; }
        .mobile-product-item {
            background: white; border-radius: 12px; padding: 15px;
            margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; justify-content: space-between; align-items: center;
        }
        .mobile-product-item .info { flex: 1; }
        .mobile-product-item .info h4 { font-size: 15px; margin-bottom: 3px; }
        .mobile-product-item .info .category { font-size: 12px; color: #7c3aed; font-weight: 600; }
        .mobile-product-item .info .price { font-size: 14px; font-weight: 700; }
        .mobile-product-item .actions { display: flex; gap: 8px; }
        .mobile-product-item .actions button {
            padding: 8px 12px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px;
        }
        .mobile-product-item .actions .edit { background: #ede9fe; color: #7c3aed; }
        .mobile-product-item .actions .delete { background: #fee2e2; color: #dc2626; }
        .mobile-fab {
            position: fixed; bottom: 20px; right: 20px;
            width: 60px; height: 60px; background: #7c3aed; color: white;
            border: none; border-radius: 50%; font-size: 28px;
            box-shadow: 0 4px 20px rgba(124,58,237,0.4);
            cursor: pointer; z-index: 99;
        }
        .mobile-fab:active { transform: scale(0.95); }
        .mobile-form {
            background: white; border-radius: 16px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: none;
        }
        .mobile-form.active { display: block; }
        .mobile-form .form-group { margin-bottom: 12px; }
        .mobile-form .form-group label {
            font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;
        }
        .mobile-form .form-group input,
        .mobile-form .form-group textarea,
        .mobile-form .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 14px; background: #f8fafc;
        }
        .mobile-form .form-group input:focus,
        .mobile-form .form-group textarea:focus {
            outline: none; border-color: #7c3aed;
        }
        .mobile-form .form-actions { display: flex; gap: 10px; }
        .mobile-form .form-actions button {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-weight: 700; font-size: 15px; cursor: pointer;
        }
        .mobile-form .form-actions .save { background: #7c3aed; color: white; }
        .mobile-form .form-actions .cancel { background: #f1f5f9; color: #64748b; }
        .mobile-search {
            width: 100%; padding: 12px 15px; border: 1px solid #d1d5db;
            border-radius: 10px; font-size: 14px; margin-bottom: 15px; background: white;
        }
        .mobile-empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .mobile-empty i { font-size: 40px; display: block; margin-bottom: 10px; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 5px;
        }
        .status-dot.active { background: #22c55e; }
        .status-dot.inactive { background: #ef4444; }
        .toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: #111827; color: white; padding: 12px 24px;
            border-radius: 12px; font-weight: 600; z-index: 999;
            display: none; max-width: 90%; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .toast.show { display: block; }
        .image-help-box {
            background: #f0fdf4; border: 1px solid #bbf7d0;
            border-radius: 10px; padding: 12px; margin-top: 8px;
        }
        .image-help-box h4 { color: #166534; font-size: 13px; margin-bottom: 6px; }
        .image-help-box ol { color: #166534; font-size: 12px; padding-left: 20px; margin: 5px 0; }
        .image-help-box a { color: #7c3aed; font-weight: 600; }
        .image-url-input { display: flex; gap: 8px; flex-wrap: wrap; }
        .image-url-input input { flex: 1; min-width: 150px; }
        .image-url-input button {
            background: #22c55e; color: white; border: none;
            border-radius: 8px; padding: 10px 15px; cursor: pointer;
            font-weight: 600; white-space: nowrap;
        }
        .image-preview { display: none; margin-top: 8px; }
        .image-preview img {
            max-width: 120px; max-height: 120px;
            border-radius: 10px; border: 2px solid #e2e8f0;
        }
        .image-preview .remove-btn {
            background: #fee2e2; color: #dc2626; border: none;
            border-radius: 6px; padding: 4px 12px; margin-top: 5px;
            font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <div class="logo">GEN.Z <span>GADGETS</span></div>
        <div style="display:flex; gap:15px; align-items:center;">
           <a href="admin-reviews.html" style="font-size:13px;">
    <i class="fa-solid fa-star"></i> Reviews
</a>
                <i class="fa-solid fa-receipt"></i> Orders
            </a>
            <a href="index.html"><i class="fa-solid fa-store"></i></a>
        </div>
    </div>

    <div class="mobile-container" id="app">

        <div class="mobile-stats">
            <div class="mobile-stat">
                <span class="num" id="totalCount">0</span>
                <span class="label">Total</span>
            </div>
            <div class="mobile-stat">
                <span class="num" id="activeCount">0</span>
                <span class="label">Active</span>
            </div>
            <div class="mobile-stat">
                <span class="num" id="stockCount">0</span>
                <span class="label">Stock</span>
            </div>
        </div>

        <input type="text" class="mobile-search" id="mobileSearch" placeholder="🔍 Search products..." oninput="searchProducts(this.value)">

        <div class="mobile-form" id="productForm">
            <h3 id="formTitle" style="margin-bottom:15px;">Add New Product</h3>
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Product Name *</label>
                <input type="text" id="pName" placeholder="e.g. Wireless Earbuds">
            </div>
            <div class="form-group">
                <label>Category *</label>
                <input type="text" id="pCategory" placeholder="e.g. Audio">
            </div>
            <div class="form-group">
                <label>Price (Rs.) *</label>
                <input type="number" id="pPrice" placeholder="2499">
            </div>
            <div class="form-group">
                <label>Old Price (Optional)</label>
                <input type="number" id="pOldPrice" placeholder="3499">
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" id="pStock" placeholder="20" value="10">
            </div>
            <div class="form-group">
                <label>Rating</label>
                <select id="pRating">
                    <option value="5">★★★★★ (5 Stars)</option>
                    <option value="4">★★★★☆ (4 Stars)</option>
                    <option value="3">★★★☆☆ (3 Stars)</option>
                    <option value="2">★★☆☆☆ (2 Stars)</option>
                    <option value="1">★☆☆☆☆ (1 Star)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Badge</label>
                <select id="pBadge">
                    <option value="">No Badge</option>
                    <option value="NEW">🔥 NEW</option>
                    <option value="SALE">💰 SALE</option>
                    <option value="HOT">⚡ HOT</option>
                </select>
            </div>
            <div class="form-group">
                <label>Product Image URL</label>
                <div class="image-url-input">
                    <input type="url" id="pImage" placeholder="https://example.com/image.jpg">
                    <button type="button" onclick="openImageHost()">
                        <i class="fa-solid fa-upload"></i> Get Image
                    </button>
                </div>
                <div class="image-preview" id="mobileImagePreview">
                    <img id="mobilePreviewImg" src="" alt="Preview">
                    <br>
                    <button class="remove-btn" onclick="removeMobileImage()">
                        <i class="fa-solid fa-xmark"></i> Remove
                    </button>
                </div>
                <div class="image-help-box">
                    <h4>📸 How to add image from mobile:</h4>
                    <ol>
                        <li>Tap <strong>"Get Image"</strong> button above</li>
                        <li>Go to <a href="https://imgbb.com" target="_blank">ImgBB.com</a></li>
                        <li>Upload your image</li>
                        <li>Copy the <strong>"Direct Link"</strong></li>
                        <li>Paste it in Image URL field</li>
                    </ol>
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="pDescription" rows="3" placeholder="Product description..."></textarea>
            </div>
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="pActive" checked>
                    Product is Active (visible on store)
                </label>
            </div>
            <div class="form-actions">
                <button class="cancel" onclick="closeForm()">Cancel</button>
                <button class="save" onclick="saveProduct()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
            </div>
        </div>

        <div id="productList"></div>
    </div>

    <button class="mobile-fab" onclick="openForm()">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div class="toast" id="toast"></div>

    <!-- Firebase Module -->
       <script type="module" src="js/firebase.js"></script>
    <script src="js/products.js"></script>

    <script>
       
        let editingId = null;

        // Wait for Firebase
        function waitForFirebase(callback) {
            if (window.firebaseDB) {
                callback();
            } else {
                setTimeout(function() { waitForFirebase(callback); }, 100);
            }
        }

        // ===== FETCH FROM FIREBASE =====
        async function fetchFromFirebase() {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, collection, getDocs } = window.firebaseDB;
                        const querySnapshot = await getDocs(collection(db, 'products'));
                        const list = [];
                        querySnapshot.forEach(function(doc) {
                            list.push(Object.assign({ id: parseInt(doc.id) }, doc.data()));
                        });
                        list.sort(function(a, b) { return a.id - b.id; });
                        localStorage.setItem('genzProducts', JSON.stringify(list));
                        resolve(list);
                    } catch (error) {
                        console.error('Fetch error:', error);
                        resolve([]);
                    }
                });
            });
        }

        // ===== SAVE TO FIREBASE =====
        async function saveToFirebase(product) {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, doc, setDoc } = window.firebaseDB;
                        await setDoc(doc(db, 'products', String(product.id)), product);
                        console.log('✅ Saved:', product.name);
                        resolve(true);
                    } catch (error) {
                        console.error('❌ Save error:', error);
                        resolve(false);
                    }
                });
            });
        }

        // ===== DELETE FROM FIREBASE =====
        async function deleteFromFirebase(productId) {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, doc, deleteDoc } = window.firebaseDB;
                        await deleteDoc(doc(db, 'products', String(productId)));
                        resolve(true);
                    } catch (error) {
                        console.error('❌ Delete error:', error);
                        resolve(false);
                    }
                });
            });
        }

        // ===== RENDER PRODUCTS =====
        function renderProducts(list) {
            if (!list) list = products;
            const container = document.getElementById('productList');
            if (list.length === 0) {
                container.innerHTML = '<div class="mobile-empty">' +
                    '<i class="fa-solid fa-box-open"></i>' +
                    '<p>No products yet.</p>' +
                    '<p style="font-size:13px;">Tap the + button to add one!</p></div>';
                return;
            }
            let html = '';
            list.forEach(function(p) {
                html += '<div class="mobile-product-item">' +
                    '<div class="info">' +
                        '<h4><span class="status-dot ' + (p.active !== false ? 'active' : 'inactive') + '"></span>' + p.name + '</h4>' +
                        '<div class="category">' + p.category + '</div>' +
                        '<div class="price">Rs. ' + Number(p.price).toLocaleString() + '</div>' +
                        '<div style="font-size:12px; color:#94a3b8;">Stock: ' + (p.stock || 0) + '</div>' +
                    '</div>' +
                    '<div class="actions">' +
                        '<button class="edit" onclick="editProduct(' + p.id + ')"><i class="fa-solid fa-pen"></i></button>' +
                        '<button class="delete" onclick="deleteProduct(' + p.id + ')"><i class="fa-solid fa-trash"></i></button>' +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            const total = products.length;
            const active = products.filter(function(p) { return p.active !== false; }).length;
            const stock = products.reduce(function(sum, p) { return sum + Number(p.stock || 0); }, 0);
            document.getElementById('totalCount').textContent = total;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('stockCount').textContent = stock;
        }

        // ===== OPEN FORM =====
        function openForm(product) {
            const form = document.getElementById('productForm');
            form.classList.add('active');
            if (product) {
                document.getElementById('formTitle').textContent = '✏️ Edit Product';
                document.getElementById('editId').value = product.id;
                document.getElementById('pName').value = product.name || '';
                document.getElementById('pCategory').value = product.category || '';
                document.getElementById('pPrice').value = product.price || '';
                document.getElementById('pOldPrice').value = product.oldPrice || '';
                document.getElementById('pStock').value = product.stock || 0;
                document.getElementById('pRating').value = product.rating || 5;
                document.getElementById('pBadge').value = product.badge || '';
                document.getElementById('pImage').value = product.image || '';
                document.getElementById('pDescription').value = product.description || '';
                document.getElementById('pActive').checked = product.active !== false;
                if (product.image) {
                    document.getElementById('mobilePreviewImg').src = product.image;
                    document.getElementById('mobileImagePreview').style.display = 'block';
                }
                editingId = product.id;
            } else {
                document.getElementById('formTitle').textContent = '➕ Add New Product';
                document.getElementById('editId').value = '';
                document.getElementById('pName').value = '';
                document.getElementById('pCategory').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pOldPrice').value = '';
                document.getElementById('pStock').value = '10';
                document.getElementById('pRating').value = '5';
                document.getElementById('pBadge').value = '';
                document.getElementById('pImage').value = '';
                document.getElementById('pDescription').value = '';
                document.getElementById('pActive').checked = true;
                document.getElementById('mobileImagePreview').style.display = 'none';
                editingId = null;
            }
            form.scrollIntoView({ behavior: 'smooth' });
        }

        // ===== CLOSE FORM =====
        function closeForm() {
            document.getElementById('productForm').classList.remove('active');
            document.getElementById('mobileImagePreview').style.display = 'none';
        }

        // ===== SAVE PRODUCT =====
        async function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            const category = document.getElementById('pCategory').value.trim();
            const price = Number(document.getElementById('pPrice').value);
            const oldPrice = Number(document.getElementById('pOldPrice').value) || null;
            const stock = Number(document.getElementById('pStock').value) || 0;
            const rating = Number(document.getElementById('pRating').value);
            const badge = document.getElementById('pBadge').value;
            const image = document.getElementById('pImage').value.trim();
            const description = document.getElementById('pDescription').value.trim();
            const active = document.getElementById('pActive').checked;

            if (!name) { showToast('❌ Enter product name'); return; }
            if (!category) { showToast('❌ Enter category'); return; }
            if (!price || price <= 0) { showToast('❌ Enter valid price'); return; }

            const editId = document.getElementById('editId').value;
            let productData;

            if (editId) {
                const index = products.findIndex(function(p) { return p.id === Number(editId); });
                if (index !== -1) {
                    products[index] = Object.assign({}, products[index], {
                        name: name, category: category, price: price, oldPrice: oldPrice,
                        stock: stock, rating: rating, badge: badge, image: image,
                        description: description, active: active
                    });
                    productData = products[index];
                }
                showToast('✏️ Product updated!');
            } else {
                const newId = products.length > 0 ? Math.max.apply(null, products.map(function(p) { return p.id; })) + 1 : 1;
                productData = {
                    id: newId, name: name, category: category, price: price,
                    oldPrice: oldPrice, stock: stock, rating: rating, badge: badge,
                    image: image, description: description, active: active,
                    icon: 'fa-box', reviews: 0
                };
                products.push(productData);
                showToast('✅ Product added!');
            }

            // Save to localStorage
            localStorage.setItem('genzProducts', JSON.stringify(products));
            renderProducts();
            updateStats();
            closeForm();

            // Save to Firebase (background)
            showToast('📤 Firebase par save ho raha hai...');
            const saved = await saveToFirebase(productData);
            if (saved) {
                showToast('✅ Firebase par save ho gaya!');
            } else {
                showToast('⚠️ Firebase save nahi hua');
            }
        }

        // ===== EDIT PRODUCT =====
        function editProduct(id) {
            const product = products.find(function(p) { return p.id === id; });
            if (product) openForm(product);
        }

        // ===== DELETE PRODUCT =====
        async function deleteProduct(id) {
            const product = products.find(function(p) { return p.id === id; });
            if (confirm('Delete "' + (product ? product.name : 'this product') + '"?')) {
                await deleteFromFirebase(id);
                products = products.filter(function(p) { return p.id !== id; });
                localStorage.setItem('genzProducts', JSON.stringify(products));
                renderProducts();
                updateStats();
                showToast('🗑️ Product deleted');
            }
        }

        // ===== SEARCH =====
        function searchProducts(query) {
            const data = products;
            if (!query.trim()) { renderProducts(data); return; }
            const filtered = data.filter(function(p) {
                return p.name.toLowerCase().includes(query.toLowerCase()) ||
                       p.category.toLowerCase().includes(query.toLowerCase());
            });
            renderProducts(filtered);
        }

        // ===== IMAGE HELPERS =====
        function openImageHost() {
            window.open('https://imgbb.com', '_blank');
            showToast('📸 Upload, copy "Direct Link"');
        }

        function removeMobileImage() {
            document.getElementById('pImage').value = '';
            document.getElementById('mobileImagePreview').style.display = 'none';
        }

        // ===== TOAST =====
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        // ===== IMAGE PREVIEW =====
        document.addEventListener('DOMContentLoaded', function() {
            const imageInput = document.getElementById('pImage');
            if (imageInput) {
                imageInput.addEventListener('input', function() {
                    const url = this.value.trim();
                    if (url) {
                        document.getElementById('mobilePreviewImg').src = url;
                        document.getElementById('mobileImagePreview').style.display = 'block';
                    } else {
                        document.getElementById('mobileImagePreview').style.display = 'none';
                    }
                });
            }
        });

        // ===== START =====
        fetchFromFirebase().then(function(list) {
            products = list;
            renderProducts();
            updateStats();
            console.log('✅ Mobile Admin Loaded');
        });
    </script>
</body>
</html>
