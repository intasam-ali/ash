<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Orders | GEN.Z GADGETS</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        /* ===== ADMIN ORDERS STYLES ===== */
        .admin-orders-container {
            padding: 40px 0 80px;
            min-height: 70vh;
        }

        .admin-header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .admin-logo {
            font-size: 22px;
            font-weight: 900;
            color: #111827;
            text-decoration: none;
        }

        .admin-logo span {
            color: #7c3aed;
        }

        .admin-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-top-bar h1 {
            font-size: 28px;
            color: #111827;
        }

        .admin-top-bar p {
            color: #64748b;
            font-size: 14px;
        }

        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .admin-stat-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-stat-box .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .admin-stat-box .stat-icon.purple {
            background: #ede9fe;
            color: #7c3aed;
        }

        .admin-stat-box .stat-icon.green {
            background: #dcfce7;
            color: #16a34a;
        }

        .admin-stat-box .stat-icon.orange {
            background: #fef3c7;
            color: #f59e0b;
        }

        .admin-stat-box .stat-icon.blue {
            background: #dbeafe;
            color: #2563eb;
        }

        .admin-stat-box .stat-info strong {
            display: block;
            font-size: 24px;
            color: #111827;
        }

        .admin-stat-box .stat-info span {
            font-size: 13px;
            color: #64748b;
        }

        .admin-orders-table-wrapper {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .admin-orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .admin-orders-table thead {
            background: #f8fafc;
        }

        .admin-orders-table th {
            padding: 14px 18px;
            text-align: left;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
        }

        .admin-orders-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        .admin-orders-table tr:hover {
            background: #f8fafc;
        }

        .admin-orders-table .order-id {
            font-weight: 700;
            color: #7c3aed;
        }

        .admin-orders-table .order-items {
            font-size: 13px;
            color: #475569;
        }

        .admin-orders-table .order-items .item {
            display: inline-block;
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 12px;
            margin: 2px 3px;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-badge.processing {
            background: #dbeafe;
            color: #2563eb;
        }

        .status-badge.completed {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-badge.cancelled {
            background: #fee2e2;
            color: #dc2626;
        }

        .order-actions select {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            background: #ffffff;
            cursor: pointer;
        }

        .order-actions select:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .order-actions .view-btn {
            padding: 6px 12px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .order-actions .view-btn:hover {
            background: #5b21b6;
        }

        .admin-empty-orders {
            text-align: center;
            padding: 60px 20px;
        }

        .admin-empty-orders i {
            font-size: 50px;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        .admin-empty-orders h3 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .admin-empty-orders p {
            color: #94a3b8;
        }

        .admin-nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .admin-nav-links a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .admin-nav-links a:hover {
            background: #f1f5f9;
            color: #111827;
        }

        .admin-nav-links a.active {
            background: #ede9fe;
            color: #7c3aed;
        }

        .admin-nav-links a .badge {
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 20px;
            margin-left: 5px;
        }

        /* ===== ORDER DETAILS MODAL ===== */
        .order-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .order-modal.active {
            display: flex;
        }

        .order-modal-content {
            background: #ffffff;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 35px;
            position: relative;
        }

        .order-modal-content .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            background: none;
            border: none;
            transition: 0.3s;
        }

        .order-modal-content .close-modal:hover {
            color: #111827;
        }

        .order-modal-content h2 {
            margin-bottom: 5px;
            color: #111827;
        }

        .order-modal-content .order-meta {
            color: #64748b;
            margin-bottom: 20px;
        }

        .order-modal-content .detail-section {
            margin-bottom: 20px;
        }

        .order-modal-content .detail-section h4 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .order-modal-content .detail-section p {
            margin: 4px 0;
            color: #1e293b;
        }

        .order-modal-content .detail-section .item-list {
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
        }

        .order-modal-content .detail-section .item-list div {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .order-modal-content .detail-section .item-list div:last-child {
            border-bottom: none;
        }

        .order-modal-content .total-amount {
            font-size: 22px;
            font-weight: 800;
            color: #7c3aed;
            border-top: 2px solid #e2e8f0;
            padding-top: 15px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .admin-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-orders-table-wrapper {
                overflow-x: auto;
            }

            .admin-orders-table {
                font-size: 12px;
                min-width: 700px;
            }

            .admin-orders-table th,
            .admin-orders-table td {
                padding: 10px 12px;
            }

            .admin-top-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-nav-links {
                flex-wrap: wrap;
            }

            .order-modal-content {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            .admin-stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ADMIN HEADER
    ========================== -->

    <header class="admin-header">
        <div class="container admin-header-inner">
            <a href="admin.html" class="admin-logo">
                GEN.Z <span>GADGETS</span>
            </a>

            <div class="admin-nav-links">
                <a href="admin.html">
                    <i class="fa-solid fa-box"></i> Products
                </a>
                <a href="admin-orders.html" class="active">
                    <i class="fa-solid fa-receipt"></i> Orders
                    <span class="badge" id="orderBadge">0</span>
                </a>
                <a href="index.html">
                    <i class="fa-solid fa-store"></i> View Store
                </a>
            </div>
        </div>
    </header>


    <!-- =========================
         ADMIN ORDERS MAIN
    ========================== -->

    <main class="admin-orders-container">
        <div class="container">

            <!-- Top Bar -->
            <div class="admin-top-bar">
                <div>
                    <h1>📦 Orders Management</h1>
                    <p>View and manage all customer orders</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <button onclick="refreshOrders()" class="primary-btn" style="padding:10px 20px; font-size:14px;">
                        <i class="fa-solid fa-rotate"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Statistics -->
            <div class="admin-stats-grid">
                <div class="admin-stat-box">
                    <div class="stat-icon purple">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="totalOrders">0</strong>
                        <span>Total Orders</span>
                    </div>
                </div>

                <div class="admin-stat-box">
                    <div class="stat-icon orange">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="pendingOrders">0</strong>
                        <span>Pending</span>
                    </div>
                </div>

                <div class="admin-stat-box">
                    <div class="stat-icon blue">
                        <i class="fa-solid fa-spinner"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="processingOrders">0</strong>
                        <span>Processing</span>
                    </div>
                </div>

                <div class="admin-stat-box">
                    <div class="stat-icon green">
                        <i class="fa-solid fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="completedOrders">0</strong>
                        <span>Completed</span>
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="admin-orders-table-wrapper">
                <table class="admin-orders-table">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersTable">
                        <!-- Orders load here -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>


    <!-- =========================
         ORDER DETAILS MODAL
    ========================== -->

    <div id="orderModal" class="order-modal">
        <div class="order-modal-content">
            <button class="close-modal" onclick="closeOrderModal()">&times;</button>
            <h2 id="modalOrderTitle">Order Details</h2>
            <p class="order-meta" id="modalOrderMeta">Order #GENZ-00000000</p>

            <div id="modalContent">
                <!-- Content loads here -->
            </div>
        </div>
    </div>


    <!-- =========================
         WHATSAPP BUTTON
    ========================== -->

    <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%20GEN.Z%20GADGETS%2C%20mujhe%20help%20chahiye."
       class="whatsapp-btn"
       target="_blank"
       aria-label="Contact GEN.Z GADGETS on WhatsApp"
       style="position:fixed; right:20px; bottom:20px; z-index:9999; background:#25D366; color:white; height:55px; padding:0 20px; border-radius:50px; display:flex; align-items:center; gap:9px; font-weight:700; box-shadow:0 8px 25px rgba(37,211,102,0.35); transition:0.3s; text-decoration:none;">
        <i class="fa-brands fa-whatsapp" style="font-size:27px;"></i>
        <span>WhatsApp Us</span>
    </a>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>
        /* ============================================
           ADMIN ORDERS JAVASCRIPT
           ============================================ */

        let allOrders = [];

        /* =========================
           LOAD ORDERS
        ========================== */

        function loadOrders() {
            const savedOrders = localStorage.getItem('genzOrders');
            if (savedOrders) {
                allOrders = JSON.parse(savedOrders);
            } else {
                allOrders = [];
            }

            renderOrders();
            updateOrderStats();
            updateOrderBadge();
        }

        /* =========================
           RENDER ORDERS
        ========================== */

        function renderOrders(orders = allOrders) {
            const table = document.getElementById('adminOrdersTable');
            if (!table) return;

            table.innerHTML = '';

            if (orders.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="admin-empty-orders">
                                <i class="fa-solid fa-receipt"></i>
                                <h3>No Orders Yet</h3>
                                <p>When customers place orders, they will appear here.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            orders.forEach(order => {
                const row = document.createElement('tr');

                // Get status badge class
                const statusClass = order.status.toLowerCase();

                // Format date
                const orderDate = new Date(order.date);
                const dateStr = orderDate.toLocaleDateString('en-PK', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                const timeStr = orderDate.toLocaleTimeString('en-PK', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Items summary
                const itemsCount = order.items.length;
                const itemsPreview = order.items.slice(0, 2).map(item =>
                    `<span class="item">${item.name}</span>`
                ).join('');

                const moreItems = itemsCount > 2 ? `<span class="item">+${itemsCount - 2} more</span>` : '';

                row.innerHTML = `
                    <td>
                        <div class="order-id">${order.orderNumber}</div>
                        <small style="color:#94a3b8; font-size:11px;">${dateStr} ${timeStr}</small>
                    </td>
                    <td>
                        <strong>${order.customer.name}</strong>
                        <br>
                        <small style="color:#94a3b8;">${order.customer.phone}</small>
                    </td>
                    <td>
                        <div class="order-items">
                            ${itemsPreview} ${moreItems}
                        </div>
                    </td>
                    <td>
                        <strong>Rs. ${order.total.toLocaleString()}</strong>
                    </td>
                    <td>
                        <span style="font-size:13px; text-transform:capitalize;">
                            ${order.payment}
                        </span>
                    </td>
                    <td>
                        <span class="status-badge ${statusClass}">
                            ${order.status}
                        </span>
                    </td>
                    <td>
                        <div class="order-actions" style="display:flex; gap:8px; flex-wrap:wrap;">
                            <select onchange="updateOrderStatus(${order.id}, this.value)">
                                <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                            <button class="view-btn" onclick="viewOrder(${order.id})">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </td>
                `;

                table.appendChild(row);
            });
        }

        /* =========================
           UPDATE ORDER STATS
        ========================== */

        function updateOrderStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(o => o.status === 'Pending').length;
            const processing = allOrders.filter(o => o.status === 'Processing').length;
            const completed = allOrders.filter(o => o.status === 'Completed').length;

            document.getElementById('totalOrders').textContent = total;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('processingOrders').textContent = processing;
            document.getElementById('completedOrders').textContent = completed;
        }

        /* =========================
           UPDATE ORDER BADGE
        ========================== */

        function updateOrderBadge() {
            const pending = allOrders.filter(o => o.status === 'Pending').length;
            const badge = document.getElementById('orderBadge');
            if (badge) {
                badge.textContent = pending;
                badge.style.display = pending > 0 ? 'inline' : 'none';
            }
        }

        /* =========================
           UPDATE ORDER STATUS
        ========================== */

        function updateOrderStatus(orderId, newStatus) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            order.status = newStatus;

            // Save to localStorage
            localStorage.setItem('genzOrders', JSON.stringify(allOrders));

            // Re-render
            renderOrders();
            updateOrderStats();
            updateOrderBadge();

            // Show notification
            showToast(`Order ${order.orderNumber} status updated to: ${newStatus}`);
        }

        /* =========================
           VIEW ORDER DETAILS
        ========================== */

        function viewOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            const modal = document.getElementById('orderModal');
            const title = document.getElementById('modalOrderTitle');
            const meta = document.getElementById('modalOrderMeta');
            const content = document.getElementById('modalContent');

            title.textContent = `Order ${order.orderNumber}`;
            meta.textContent = `Placed on ${new Date(order.date).toLocaleString('en-PK')}`;

            // Build items list
            let itemsHTML = order.items.map(item =>
                `<div>
                    <span>${item.name} (x${item.quantity})</span>
                    <span>Rs. ${(item.price * item.quantity).toLocaleString()}</span>
                </div>
            `).join('');

            content.innerHTML = `
                <div class="detail-section">
                    <h4>👤 Customer Details</h4>
                    <p><strong>Name:</strong> ${order.customer.name}</p>
                    <p><strong>Phone:</strong> ${order.customer.phone}</p>
                    <p><strong>Email:</strong> ${order.customer.email}</p>
                    <p><strong>City:</strong> ${order.customer.city}</p>
                    <p><strong>Address:</strong> ${order.customer.address}</p>
                    ${order.customer.instructions !== 'None' ? `<p><strong>Instructions:</strong> ${order.customer.instructions}</p>` : ''}
                </div>

                <div class="detail-section">
                    <h4>🛍️ Order Items</h4>
                    <div class="item-list">
                        ${itemsHTML}
                    </div>
                </div>

                <div class="detail-section">
                    <h4>💳 Payment</h4>
                    <p><strong>Method:</strong> ${order.payment.charAt(0).toUpperCase() + order.payment.slice(1)}</p>
                    <p><strong>Status:</strong> <span class="status-badge ${order.status.toLowerCase()}">${order.status}</span></p>
                </div>

                <div class="total-amount">
                    Total: Rs. ${order.total.toLocaleString()}
                </div>

                <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
                    <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%20GEN.Z%20GADGETS%2C%20Order%20%23${order.orderNumber}%20ka%20status%3A%20${order.status}" 
                       target="_blank"
                       class="primary-btn" 
                       style="background:#25D366; color:white; text-decoration:none; padding:10px 20px; border-radius:8px; font-weight:600;">
                        <i class="fa-brands fa-whatsapp"></i> Contact Customer
                    </a>
                    <button onclick="closeOrderModal()" class="primary-btn" style="background:#64748b; padding:10px 20px; border-radius:8px; border:none; color:white; font-weight:600; cursor:pointer;">
                        Close
                    </button>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        /* =========================
           CLOSE ORDER MODAL
        ========================== */

        function closeOrderModal() {
            const modal = document.getElementById('orderModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        /* =========================
           REFRESH ORDERS
        ========================== */

        function refreshOrders() {
            loadOrders();
            showToast('🔄 Orders refreshed!');
        }

        /* =========================
           TOAST NOTIFICATION
        ========================== */

        function showToast(message) {
            // Create toast element if it doesn't exist
            let toast = document.getElementById('toastNotification');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toastNotification';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 100px;
                    right: 20px;
                    background: #111827;
                    color: white;
                    padding: 15px 25px;
                    border-radius: 12px;
                    font-weight: 600;
                    z-index: 99999;
                    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
                    transform: translateX(120%);
                    transition: transform 0.4s ease;
                    max-width: 350px;
                `;
                document.body.appendChild(toast);
            }

            toast.textContent = message;
            toast.style.transform = 'translateX(0)';

            setTimeout(() => {
                toast.style.transform = 'translateX(120%)';
            }, 3000);
        }

        /* =========================
           CLOSE MODAL ON OVERLAY CLICK
        ========================== */

        document.getElementById('orderModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeOrderModal();
            }
        });

        /* =========================
           KEYBOARD SHORTCUT: ESC to close modal
        ========================== */

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeOrderModal();
            }
        });

        /* =========================
           START ADMIN ORDERS
        ========================== */

        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
            console.log('✅ ADMIN ORDERS LOADED');
        });

        // Also run if DOM is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            loadOrders();
        }
    </script>

</body>
</html>
