<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; padding-bottom: 50px; }
        .header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 20px; font-weight: 900; text-decoration: none; color: #111827; }
        .logo span { color: #7c3aed; }
        .nav-links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .nav-links a { color: #64748b; text-decoration: none; font-weight: 600; padding: 8px 15px; border-radius: 8px; font-size: 14px; }
        .nav-links a:hover { background: #f1f5f9; color: #111827; }
        .nav-links a.active { background: #ede9fe; color: #7c3aed; }
        .nav-links a .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 7px; border-radius: 20px; margin-left: 5px; }
        .nav-links a.logout { color: #dc2626; }
        .nav-links a.logout:hover { background: #fee2e2; }
        .container { max-width: 1200px; margin: 0 auto; padding: 25px 20px; }
        .page-title { font-size: 26px; color: #111827; margin-bottom: 5px; }
        .page-subtitle { color: #64748b; margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .stat-icon.purple { background: #ede9fe; color: #7c3aed; }
        .stat-icon.orange { background: #fef3c7; color: #f59e0b; }
        .stat-icon.blue { background: #dbeafe; color: #2563eb; }
        .stat-icon.green { background: #dcfce7; color: #16a34a; }
        .stat-info strong { display: block; font-size: 22px; color: #111827; }
        .stat-info span { font-size: 12px; color: #64748b; }
        .refresh-btn { background: #7c3aed; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .refresh-btn:hover { background: #6d28d9; }
        .order-card { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 15px; overflow: hidden; }
        .order-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .order-header .order-num { font-weight: 800; color: #7c3aed; font-size: 16px; }
        .order-header .order-date { font-size: 12px; color: #94a3b8; }
        .order-body { padding: 20px; }
        .order-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .order-row strong { color: #475569; }
        .order-row span { color: #111827; font-weight: 600; text-align: right; }
        .order-items-list { background: #f8fafc; border-radius: 10px; padding: 12px 15px; margin: 12px 0; }
        .order-item-line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; border-bottom: 1px dashed #e2e8f0; }
        .order-item-line:last-child { border-bottom: none; }
        .order-total-line { display: flex; justify-content: space-between; padding: 12px 0; border-top: 2px solid #e2e8f0; margin-top: 8px; font-size: 18px; font-weight: 800; color: #7c3aed; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .status-badge.pending { background: #fef3c7; color: #d97706; }
        .status-badge.processing { background: #dbeafe; color: #2563eb; }
        .status-badge.completed { background: #dcfce7; color: #16a34a; }
        .status-badge.cancelled { background: #fee2e2; color: #dc2626; }
        .order-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        .order-actions button, .order-actions select {
            padding: 8px 15px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .order-actions select { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .order-actions .delete-btn { background: #fee2e2; color: #dc2626; }
        .order-actions .delete-btn:hover { background: #dc2626; color: white; }
        .order-actions .wa-btn { background: #25D366; color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
        .empty-orders { text-align: center; padding: 60px 20px; background: #fff; border-radius: 14px; }
        .empty-orders i { font-size: 50px; color: #cbd5e1; margin-bottom: 15px; display: block; }
        .empty-orders h3 { color: #1e293b; margin-bottom: 8px; }
        .empty-orders p { color: #94a3b8; }
        .loading { text-align: center; padding: 60px 20px; color: #94a3b8; }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-links a { padding: 6px 10px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-box { padding: 12px; gap: 10px; }
            .stat-icon { width: 38px; height: 38px; font-size: 16px; }
            .stat-info strong { font-size: 18px; }
            .stat-info span { font-size: 11px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a href="admin-mobile.html" class="logo">GEN.Z <span>GADGETS</span></a>
            <div class="nav-links">
                <a href="admin-mobile.html"><i class="fa-solid fa-box"></i> Products</a>
                <a href="admin-orders.html" class="active">
                    <i class="fa-solid fa-receipt"></i> Orders
                    <span class="badge" id="orderBadge">0</span>
                </a>
                <a href="admin-reviews.html"><i class="fa-solid fa-star"></i> Reviews</a>
                <a href="admin-categories.html"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="index.html"><i class="fa-solid fa-store"></i> Store</a>
                <a href="#" onclick="logoutAdmin()" class="logout"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">📦 Orders Management</h1>
        <p class="page-subtitle">View and manage all customer orders</p>

        <button class="refresh-btn" onclick="loadOrders()">
            <i class="fa-solid fa-rotate"></i> Refresh
        </button>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-icon purple"><i class="fa-solid fa-receipt"></i></div>
                <div class="stat-info">
                    <strong id="totalOrders">0</strong>
                    <span>Total Orders</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon orange"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info">
                    <strong id="pendingOrders">0</strong>
                    <span>Pending</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon blue"><i class="fa-solid fa-spinner"></i></div>
                <div class="stat-info">
                    <strong id="processingOrders">0</strong>
                    <span>Processing</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon green"><i class="fa-solid fa-check-circle"></i></div>
                <div class="stat-info">
                    <strong id="completedOrders">0</strong>
                    <span>Completed</span>
                </div>
            </div>
        </div>

        <div id="ordersContainer">
            <div class="loading">Loading orders...</div>
        </div>
    </div>

    <!-- ===== AUTH CHECK ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZRn0KADLkLTexwzOpnqR-VKzRqQKPUGY",
            authDomain: "genz-gadgets.firebaseapp.com",
            projectId: "genz-gadgets",
            storageBucket: "genz-gadgets.firebasestorage.app",
            messagingSenderId: "473246555348",
            appId: "1:473246555348:web:9944b3fc49a8a57e966f41"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, function(user) {
            if (!user) {
                window.location.href = 'admin-login.html';
            }
        });
    </script>

    <script type="module" src="js/firebase.js"></script>
    <script>
        let allOrders = [];

        function waitForFirebase(callback) {
            if (window.firebaseDB) {
                callback();
            } else {
                setTimeout(function() { waitForFirebase(callback); }, 100);
            }
        }

        async function fetchOrdersFromFirebase() {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, collection, getDocs } = window.firebaseDB;
                        const snapshot = await getDocs(collection(db, 'orders'));
                        const orders = [];
                        snapshot.forEach(function(doc) {
                            orders.push(doc.data());
                        });
                        orders.sort(function(a, b) {
                            return new Date(b.date) - new Date(a.date);
                        });
                        resolve(orders);
                    } catch (error) {
                        console.error('❌ Firebase orders fetch error:', error);
                        resolve([]);
                    }
                });
            });
        }

        async function updateOrderStatus(orderNumber, newStatus) {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, doc, updateDoc } = window.firebaseDB;
                        await updateDoc(doc(db, 'orders', orderNumber), { status: newStatus });
                        resolve(true);
                    } catch (error) {
                        console.error('Update error:', error);
                        resolve(false);
                    }
                });
            });
        }

        async function deleteOrderFromFirebase(orderNumber) {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, doc, deleteDoc } = window.firebaseDB;
                        await deleteDoc(doc(db, 'orders', orderNumber));
                        resolve(true);
                    } catch (error) {
                        console.error('Delete error:', error);
                        resolve(false);
                    }
                });
            });
        }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '<div class="loading">Loading orders...</div>';

            allOrders = await fetchOrdersFromFirebase();
            renderOrders();
            updateStats();
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');

            if (allOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-orders">
                        <i class="fa-solid fa-receipt"></i>
                        <h3>No Orders Yet</h3>
                        <p>When customers place orders, they will appear here.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allOrders.map(function(order) {
                const statusClass = (order.status || 'Pending').toLowerCase();
                const dateStr = new Date(order.date).toLocaleString('en-PK', {
                    day: 'numeric', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                const itemsHTML = order.items.map(function(item) {
                    return '<div class="order-item-line">' +
                        '<span>' + item.name + ' × ' + item.quantity + '</span>' +
                        '<span>Rs. ' + (item.price * item.quantity).toLocaleString() + '</span>' +
                    '</div>';
                }).join('');

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-num">${order.orderNumber}</div>
                                <div class="order-date">${dateStr}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${order.status || 'Pending'}</span>
                        </div>
                        <div class="order-body">
                            <div class="order-row">
                                <strong>👤 Customer:</strong>
                                <span>${order.customer.name}</span>
                            </div>
                            <div class="order-row">
                                <strong>📱 Phone:</strong>
                                <span>${order.customer.phone}</span>
                            </div>
                            <div class="order-row">
                                <strong>📍 City:</strong>
                                <span>${order.customer.city}</span>
                            </div>
                            <div class="order-row">
                                <strong>🏠 Address:</strong>
                                <span>${order.customer.address}</span>
                            </div>
                            ${order.customer.instructions && order.customer.instructions !== 'None' ? `
                            <div class="order-row">
                                <strong>📝 Instructions:</strong>
                                <span>${order.customer.instructions}</span>
                            </div>` : ''}
                            <div class="order-row">
                                <strong>💳 Payment:</strong>
                                <span style="text-transform: capitalize;">${order.payment}</span>
                            </div>

                            <div class="order-items-list">
                                ${itemsHTML}
                            </div>

                            <div class="order-total-line">
                                <span>Total</span>
                                <span>Rs. ${order.total.toLocaleString()}</span>
                            </div>

                            <div class="order-actions">
                                <select onchange="changeStatus('${order.orderNumber}', this.value)">
                                    <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                    <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                                <a href="https://wa.me/92${order.customer.phone.replace(/[^0-9]/g, '').replace(/^0/, '')}" target="_blank" class="wa-btn">
                                    <i class="fa-brands fa-whatsapp"></i> Contact
                                </a>
                                <button class="delete-btn" onclick="deleteOrder('${order.orderNumber}')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(function(o) { return o.status === 'Pending'; }).length;
            const processing = allOrders.filter(function(o) { return o.status === 'Processing'; }).length;
            const completed = allOrders.filter(function(o) { return o.status === 'Completed'; }).length;

            document.getElementById('totalOrders').textContent = total;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('processingOrders').textContent = processing;
            document.getElementById('completedOrders').textContent = completed;
            document.getElementById('orderBadge').textContent = pending;
        }

        async function changeStatus(orderNumber, newStatus) {
            const ok = await updateOrderStatus(orderNumber, newStatus);
            if (ok) {
                const order = allOrders.find(function(o) { return o.orderNumber === orderNumber; });
                if (order) order.status = newStatus;
                renderOrders();
                updateStats();
                alert('✅ Status updated to: ' + newStatus);
            } else {
                alert('❌ Status update failed');
            }
        }

        async function deleteOrder(orderNumber) {
            if (!confirm('Delete order ' + orderNumber + '?')) return;
            const ok = await deleteOrderFromFirebase(orderNumber);
            if (ok) {
                allOrders = allOrders.filter(function(o) { return o.orderNumber !== orderNumber; });
                renderOrders();
                updateStats();
                alert('🗑️ Order deleted');
            } else {
                alert('❌ Delete failed');
            }
        }

        function logoutAdmin() {
            if (!confirm('Logout karna chahte hain?')) return;
            import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js').then(function(module) {
                const auth = module.getAuth();
                module.signOut(auth).then(function() {
                    window.location.href = 'admin-login.html';
                });
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadOrders, 800);
        });
    </script>
</body>
</html>
