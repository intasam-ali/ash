<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-logo {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 8px;
        }
        .login-logo span { color: #7c3aed; }
        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c3aed;
            background: white;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124,58,237,0.35);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-box {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
        .error-box.show { display: block; }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #7c3aed;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">GEN.Z <span>GADGETS</span></div>
        <div class="login-subtitle">🔐 Admin Panel Login</div>

        <div class="error-box" id="errorBox"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="admin@genzgadgets.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fa-solid fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZRn0KADLkLTexwzOpnqR-VKzRqQKPUGY",
            authDomain: "genz-gadgets.firebaseapp.com",
            projectId: "genz-gadgets",
            storageBucket: "genz-gadgets.firebasestorage.app",
            messagingSenderId: "473246555348",
            appId: "1:473246555348:web:9944b3fc49a8a57e966f41"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check if already logged in
        auth.onAuthStateChanged(function(user) {
            if (user) {
                // Already logged in, go to admin panel
                window.location.href = 'admin-mobile.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('errorBox');

            errorBox.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Success - redirect to admin panel
                window.location.href = 'admin-mobile.html';
            } catch (error) {
                console.error('Login error:', error);
                errorBox.classList.add('show');

                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    errorBox.textContent = '❌ Email ya password ghalat hai';
                } else if (error.code === 'auth/user-not-found') {
                    errorBox.textContent = '❌ Yeh user exist nahi karta';
                } else if (error.code === 'auth/too-many-requests') {
                    errorBox.textContent = '⚠️ Bohat zyada attempts. 5 minute wait karein';
                } else {
                    errorBox.textContent = '❌ Login failed: ' + error.message;
                }

                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i> Login';
            }
        });
    </script>
</body>
</html>
