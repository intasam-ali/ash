<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ===== PRODUCT REVIEWS SECTION ===== */
        .product-reviews-section {
            padding: 50px 0 60px;
            background: #f8fafc;
        }
        .product-reviews-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .reviews-title {
            font-size: 26px;
            color: #111827;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reviews-title i { color: #f59e0b; }

        .product-rating-summary {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .pr-summary-left {
            text-align: center;
            padding-right: 30px;
            border-right: 2px dashed #e2e8f0;
        }
        .pr-big-rating {
            font-size: 56px;
            font-weight: 900;
            color: #7c3aed;
            line-height: 1;
        }
        .pr-stars {
            font-size: 22px;
            color: #f59e0b;
            letter-spacing: 3px;
            margin: 8px 0;
        }
        .pr-count {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }
        .pr-summary-right { flex: 1; min-width: 200px; }
        .pr-summary-right p {
            color: #475569;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .pr-write-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }
        .pr-write-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124,58,237,0.35);
        }

        .product-reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-review-item {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }
        .product-review-item:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .pr-item-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .pr-item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }
        .pr-item-name {
            flex: 1;
        }
        .pr-item-name strong {
            display: block;
            color: #111827;
            font-size: 14px;
        }
        .pr-item-name small {
            color: #94a3b8;
            font-size: 12px;
        }
        .pr-item-stars {
            color: #f59e0b;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .pr-item-text {
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
        }
        .pr-no-reviews {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        .pr-no-reviews i {
            font-size: 45px;
            color: #cbd5e1;
            margin-bottom: 15px;
            display: block;
        }
        .pr-no-reviews h3 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .pr-no-reviews p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .pr-summary-left {
                border-right: none;
                padding-right: 0;
                padding-bottom: 15px;
                border-bottom: 2px dashed #e2e8f0;
                width: 100%;
            }
            .product-rating-summary {
                flex-direction: column;
                gap: 15px;
            }
            .pr-big-rating { font-size: 48px; }
        }
    </style>
</head>
<body>

                <div class="product-reviews-list" id="productReviewsList">
