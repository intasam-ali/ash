<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ===== LIGHT BLACK THEME ===== */
        :root {
            --bg-dark: #1a1a1a;
            --bg-darker: #141414;
            --card-bg: #222222;
            --card-hover: #2a2a2a;
            --border-dark: #333333;
            --text-light: #f5f5f5;
            --text-muted: #a3a3a3;
            --purple: #7c3aed;
            --purple-light: #a78bfa;
            --cyan: #06b6d4;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(20, 20, 20, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-dark) !important;
        }
        .navbar { min-height: 75px; }

        /* ===== LOGO ===== */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white !important;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        .logo-icon svg { width: 26px; height: 26px; }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-text .genz {
            font-size: 19px;
            font-weight: 900;
            color: white;
            letter-spacing: 1.5px;
        }
        .logo-text .gadgets {
            font-size: 10px;
            font-weight: 700;
            color: #a78bfa;
            letter-spacing: 4px;
            margin-top: 3px;
        }

        /* ===== SEARCH BOX ===== */
        .search-box {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-dark) !important;
            position: relative;
        }
        .search-box input {
            color: white !important;
            background: transparent !important;
        }
        .search-box input::placeholder { color: #737373; }
        .search-box button {
            background: linear-gradient(135deg, #7c3aed, #06b6d4) !important;
        }

        /* ===== NAV ICONS ===== */
        .nav-icons a { color: white !important; }
        .nav-icons a:hover { color: #a78bfa !important; }

        /* ===== PRODUCT DETAILS SECTION ===== */
        .product-details-section {
            padding: 40px 0 80px;
            min-height: 70vh;
            background: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 30px;
            padding: 8px 18px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-dark);
            transition: 0.3s;
        }
        .back-link:hover {
            background: var(--card-hover);
            color: #a78bfa;
            border-color: var(--purple);
        }

        /* ===== PRODUCT DETAILS CARD ===== */
        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-dark);
        }

        /* ===== DETAILS IMAGE ===== */
        .details-image {
            min-height: 430px;
            background: #1a1a1a;
            border-radius: 18px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-dark);
        }
        .details-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
            cursor: zoom-in;
            transition: transform 0.3s;
        }
        .details-image img:hover {
            transform: scale(1.05);
        }

        .details-placeholder {
            width: 260px;
            height: 260px;
            border-radius: 20px;
            background: var(--card-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-dark);
        }
        .details-placeholder i {
            font-size: 120px;
            color: #a78bfa;
        }

        .details-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        /* ===== DETAILS INFO ===== */
        .details-info {
            padding: 15px 5px;
        }

        .details-info .product-category {
            color: #a78bfa;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details-info h1 {
            font-size: 34px;
            line-height: 1.2;
            color: white;
            margin-bottom: 18px;
        }

        .details-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .details-price {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .details-price strong {
            color: white;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .details-price del {
            color: #737373;
            font-size: 18px;
        }

        .details-description {
            color: #d4d4d4;
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .stock-status {
            color: #22c55e;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        /* ===== QUANTITY ===== */
        .quantity-box {
            display: inline-flex;
            align-items: center;
            border: 2px solid var(--border-dark);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: var(--card-hover);
        }
        .quantity-box button {
            width: 45px;
            height: 45px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 22px;
            color: white;
            font-weight: 700;
            transition: 0.3s;
        }
        .quantity-box button:hover {
            background: var(--purple);
        }
        .quantity-box span {
            width: 50px;
            text-align: center;
            font-weight: 800;
            color: white;
            font-size: 17px;
        }

        /* ===== BUTTONS ===== */
        .details-cart-btn, .buy-now-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }
        .details-cart-btn {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
        }
        .details-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);
        }
        .buy-now-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }
        .buy-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
        }
        .details-cart-btn:disabled, .buy-now-btn:disabled {
            background: #4a4a4a;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ===== FEATURES ===== */
        .product-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
        }
        .product-features div {
            text-align: center;
            padding: 18px 10px;
            background: var(--card-hover);
            border-radius: 12px;
            border: 1px solid var(--border-dark);
            transition: 0.3s;
        }
        .product-features div:hover {
            border-color: var(--purple);
            transform: translateY(-3px);
        }
        .product-features i {
            display: block;
            color: #a78bfa;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .product-features span {
            font-size: 12px;
            color: #d4d4d4;
            font-weight: 600;
        }

        /* ===== NOT FOUND ===== */
        .product-not-found {
            text-align: center;
            padding: 80px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-dark);
        }
        .product-not-found i {
            font-size: 60px;
            color: #737373;
            margin-bottom: 20px;
            display: block;
        }
        .product-not-found h2 {
            color: white;
            margin-bottom: 10px;
        }
        .product-not-found p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }
        .primary-btn {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* ===== PRODUCT REVIEWS SECTION ===== */
        .product-reviews-section {
            padding: 50px 0 60px;
            background: transparent;
        }
        .product-reviews-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .reviews-title {
            font-size: 26px;
            color: white;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reviews-title i { color: #f59e0b; }

        .product-rating-summary {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--border-dark);
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .pr-summary-left {
            text-align: center;
            padding-right: 30px;
            border-right: 2px dashed var(--border-dark);
        }
        .pr-big-rating {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .pr-stars {
            font-size: 22px;
            color: #f59e0b;
            letter-spacing: 3px;
            margin: 8px 0;
        }
        .pr-count {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }
        .pr-summary-right { flex: 1; min-width: 200px; }
        .pr-summary-right p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
        }
        .pr-write-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }
        .pr-write-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.35);
        }

        .product-reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-review-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border-dark);
            transition: 0.3s;
        }
        .product-review-item:hover {
            border-color: var(--purple);
            transform: translateY(-3px);
        }
        .pr-item-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .pr-item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }
        .pr-item-name { flex: 1; }
        .pr-item-name strong {
            display: block;
            color: white;
            font-size: 14px;
        }
        .pr-item-name small {
            color: #8a8a8a;
            font-size: 12px;
        }
        .pr-item-stars {
            color: #f59e0b;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .pr-item-text {
            color: #d4d4d4;
            font-size: 14px;
            line-height: 1.6;
        }
        .pr-no-reviews {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-dark);
        }
        .pr-no-reviews i {
            font-size: 45px;
            color: #737373;
            margin-bottom: 15px;
            display: block;
        }
        .pr-no-reviews h3 {
            color: white;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .pr-no-reviews p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ===== SIMILAR PRODUCTS ===== */
        .similar-products-section {
            grid-column: 1/-1;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid var(--border-dark);
        }
        .similar-title {
            font-size: 22px;
            color: white;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .similar-title i { color: #f59e0b; }
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        .similar-card {
            background: var(--card-hover);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-dark);
            cursor: pointer;
            transition: 0.3s;
        }
        .similar-card:hover {
            transform: translateY(-5px);
            border-color: var(--purple);
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.2);
        }
        .similar-card-image {
            height: 180px;
            background: #1a1a1a;
            overflow: hidden;
        }
        .similar-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .similar-card-info {
            padding: 14px;
        }
        .similar-card-info .cat {
            font-size: 11px;
            color: #a78bfa;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .similar-card-info h3 {
            font-size: 14px;
            color: white;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .similar-card-info .stars {
            color: #f59e0b;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .similar-card-info .price {
            font-size: 15px;
            font-weight: 800;
            color: white;
        }
        .similar-card-info .price del {
            color: #737373;
            font-size: 12px;
            margin-left: 5px;
        }

        /* ===== IMAGE ZOOM MODAL ===== */
        #imageZoomModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 20px;
        }
        #imageZoomModal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 25px 80px rgba(124, 58, 237, 0.3);
        }
        .zoom-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #111827;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== WHATSAPP ===== */
        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366, #128C7E) !important;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35) !important;
        }

        /* ===== MOBILE MENU ===== */
        .mobile-menu {
            background: var(--bg-darker) !important;
            border-top: 1px solid var(--border-dark);
        }
        .mobile-menu a {
            color: white !important;
            border-bottom: 1px solid var(--border-dark);
        }
        .mobile-menu a:hover { color: #a78bfa !important; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .product-details-section {
                padding: 20px 15px 60px;
            }
            .product-details {
                grid-template-columns: 1fr;
                gap: 25px;
                padding: 20px;
            }
            .details-image {
                min-height: 300px;
            }
            .details-placeholder {
                width: 190px;
                height: 190px;
            }
            .details-placeholder i {
                font-size: 85px;
            }
            .details-info h1 {
                font-size: 26px;
            }
            .details-price strong {
                font-size: 26px;
            }
            .product-features {
                grid-template-columns: 1fr;
            }
            .pr-summary-left {
                border-right: none;
                padding-right: 0;
                padding-bottom: 15px;
                border-bottom: 2px dashed var(--border-dark);
                width: 100%;
            }
            .product-rating-summary {
                flex-direction: column;
                gap: 15px;
            }
            .pr-big-rating { font-size: 48px; }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 2L9 17H14L11 30L23 13H17L19 2Z" fill="#fbbf24" stroke="#fbbf24" stroke-width="0.5" stroke-linejoin="round"/>
                        <text x="16" y="26" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-0.3">GZ</text>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="genz">GEN.Z</span>
                    <span class="gadgets">GADGETS</span>
                </div>
            </a>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search mobile accessories...">
                <button onclick="goToHomeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="nav-icons">
                <a href="track-order.html" title="Track Order" style="display:flex; align-items:center; gap:5px; text-decoration:none; font-weight:600; font-size:13px;">
                    <i class="fa-solid fa-truck-fast"></i>
                </a>
                <a href="wishlist.html" class="wishlist-icon" title="Wishlist" style="position:relative;">
                    <i class="fa-regular fa-heart"></i>
                </a>
                <a href="cart.html" class="cart-icon" title="Shopping Cart" style="position:relative;">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount" style="position:absolute; top:-8px; right:-10px; background:linear-gradient(135deg,#7c3aed,#06b6d4); color:white; font-size:10px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700;">0</span>
                </a>
                <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>

        <nav id="mobileMenu" class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#products">Products</a>
            <a href="track-order.html">Track Order</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="index.html#reviews">Reviews</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <!-- ================= PRODUCT DETAILS ================= -->
    <main class="product-details-section">
        <div class="container">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Products
            </a>
            <div class="product-details" id="productDetails"></div>
        </div>
    </main>

    <!-- ================= PRODUCT REVIEWS ================= -->
    <section class="product-reviews-section" id="productReviewsSection" style="display:none;">
        <div class="container">
            <div class="product-reviews-container">
                <h2 class="reviews-title">
                    <i class="fa-solid fa-star"></i> Customer Reviews
                </h2>

                <div class="product-rating-summary">
                    <div class="pr-summary-left">
                        <div class="pr-big-rating" id="productBigRating">0.0</div>
                        <div class="pr-stars" id="productStars">☆☆☆☆☆</div>
                        <div class="pr-count" id="productReviewCount">0 reviews</div>
                    </div>
                    <div class="pr-summary-right">
                        <p>Kya aapne yeh product use kiya hai? Apna tajurba share karein!</p>
                        <a href="#" class="pr-write-btn" id="writeReviewLink">
                            <i class="fa-solid fa-pen"></i> Write a Review
                        </a>
                    </div>
                </div>
