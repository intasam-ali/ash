<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .track-section { padding: 50px 0 80px; min-height: 70vh; }
        .track-header { text-align: center; margin-bottom: 40px; }
        .track-header h1 {
            font-size: 32px; color: #111827; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .track-header h1 i { color: #7c3aed; }
        .track-header p { color: #64748b; font-size: 15px; }
        .track-form-box {
            max-width: 600px; margin: 0 auto 30px;
            background: #fff; border-radius: 16px; padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .track-form-box label {
            display: block; font-weight: 600; font-size: 14px;
            color: #1e293b; margin-bottom: 8px;
        }
        .track-input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .track-input-group input {
            flex: 1; min-width: 200px;
            padding: 14px 16px; border: 2px solid #e2e8f0;
            border-radius: 10px; font-size: 15px;
            background: #f8fafc;
        }
        .track-input-group input:focus {
            outline: none; border-color: #7c3aed;
            background: #fff;
        }
        .track-input-group button {
            background: #7c3aed; color: white; border: none;
            padding: 14px 28px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .track-input-group button:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }
        .order-result {
            max-width: 700px; margin: 0 auto;
            background: #fff; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .order-result-header {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .order-result-header .order-info h3 {
            font-size: 14px; opacity: 0.9;
            margin-bottom: 4px; font-weight: 500;
        }
        .order-result-header .order-info strong {
            font-size: 22px; font-weight: 800;
        }
        .status-pill {
            background: rgba(255,255,255,0.25);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(10px);
        }
        .order-result-body { padding: 30px; }
        .status-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0 40px;
            padding: 0 10px;
        }
        .status-timeline::before {
            content: '';
            position: absolute;
            top: 22px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #e2e8f0;
            z-index: 1;
        }
        .timeline-progress {
            position: absolute;
            top: 22px;
            left: 10%;
            height: 3px;
            background: #22c55e;
            z-index: 1;
            transition: width 0.5s;
        }
        .timeline-step {
            text-align: center;
            position: relative;
            z-index: 2;
            flex: 1;
        }
        .timeline-icon {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 3px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 18px;
            color: #94a3b8;
            transition: 0.3s;
        }
        .timeline-step.active .timeline-icon {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(34,197,94,0.35);
        }
        .timeline-step.completed .timeline-icon {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }
        .timeline-step.cancelled .timeline-icon {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }
        .timeline-step span {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }
        .timeline-step.active span,
        .timeline-step.completed span {
            color: #22c55e;
        }
        .detail-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .detail-section h4 {
            font-size: 14px; color: #7c3aed;
            margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row strong { color: #64748b; font-weight: 600; }
        .detail-row span { color: #111827; font-weight: 600; text-align: right; }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 14px;
        }
        .item-row:last-child { border-bottom: none; }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-top: 2px solid #e2e8f0;
            margin-top: 10px;
            font-size: 18px;
            font-weight: 800;
            color: #7c3aed;
        }
        .help-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 15px 20px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .help-box p {
            flex: 1;
            color: #166534;
            font-size: 14px;
            margin: 0;
        }
        .help-box a {
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .not-found-box {
            max-width: 600px; margin: 0 auto;
            background: #fff; border-radius: 16px; padding: 50px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .not-found-box i {
            font-size: 60px; color: #f59e0b;
            margin-bottom: 20px;
        }
        .not-found-box h2 { color: #1e293b; margin-bottom: 10px; }
        .not-found-box p { color: #94a3b8; margin-bottom: 20px; }
        .loading-box {
            text-align: center; padding: 50px;
            color: #94a3b8; font-size: 16px;
        }
        @media (max-width: 500px) {
            .track-header h1 { font-size: 24px; }
            .order-result-header { padding: 20px; }
            .order-result-body { padding: 20px; }
            .timeline-step span { font-size: 10px; }
            .timeline-icon { width: 38px; height: 38px; font-size: 15px; }
            .status-timeline::before,
            .timeline-progress { top: 19px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">GEN.Z <span>GADGETS</span></a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search mobile accessories...">
                <button onclick="goToHomeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="nav-icons">
                <a href="track-order.html" title="Track Order" style="display:flex; align-items:center; gap:5px; text-decoration:none; color:#7c3aed; font-weight:600; font-size:14px;">
                    <i class="fa-solid fa-truck-fast"></i>
                </a>
                <a href="#" title="Wishlist"><i class="fa-regular fa-heart"></i></a>
                <a href="cart.html" class="cart-icon" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </a>
                <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
        <nav id="mobileMenu" class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#products">Products</a>
            <a href="track-order.html">Track Order</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <section class="track-section">
        <div class="container">
            <div class="track-header">
                <h1><i class="fa-solid fa-truck-fast"></i> Track Your Order</h1>
                <p>Enter your order number to see the current status of your order</p>
            </div>

            <div class="track-form-box">
                <label><i class="fa-solid fa-hashtag"></i> Order Number</label>
                <div class="track-input-group">
                    <input
                        type="text"
                        id="orderNumberInput"
                        placeholder="e.g. GENZ-31750187"
                        autocomplete="off"
                    >
                    <button onclick="trackOrder()">
                        <i class="fa-solid fa-magnifying-glass"></i> Track
                    </button>
                </div>
                <p style="font-size:12px; color:#94a3b8; margin-top:10px;">
                    💡 Order number aapko WhatsApp par mila hoga (e.g. GENZ-31750187)
                </p>
            </div>

            <div id="resultContainer"></div>

        </div>
    </section>

    <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%20GEN.Z%20GADGETS%2C%20mujhe%20order%20track%20karne%20mein%20help%20chahiye."
       class="whatsapp-btn"
       target="_blank"
       style="position:fixed; right:20px; bottom:20px; z-index:9999; background:#25D366; color:white; height:55px; padding:0 20px; border-radius:50px; display:flex; align-items:center; gap:9px; font-weight:700; box-shadow:0 8px 25px rgba(37,211,102,0.35); text-decoration:none;">
        <i class="fa-brands fa-whatsapp" style="font-size:27px;"></i>
        <span>WhatsApp Us</span>
    </a>

    <script type="module" src="js/firebase.js"></script>
    <script>
        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('genzCart')) || [];
            const totalItems = cart.reduce(function(sum, item) { return sum + item.quantity; }, 0);
            const cartElement = document.getElementById('cartCount');
            if (cartElement) cartElement.textContent = totalItems;
        }

        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            if (menu) menu.classList.toggle('active');
        }

        function goToHomeSearch() {
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) { window.location.href = 'index.html'; return; }
            const searchValue = searchInput.value.trim();
            if (!searchValue) { window.location.href = 'index.html'; return; }
            window.location.href = 'index.html?search=' + encodeURIComponent(searchValue);
        }

        function waitForFirebase(callback) {
            if (window.firebaseDB) {
                callback();
            } else {
                setTimeout(function() { waitForFirebase(callback); }, 100);
            }
        }

        async function fetchOrderFromFirebase(orderNumber) {
            return new Promise(function(resolve) {
                waitForFirebase(async function() {
                    try {
                        const { db, doc, getDoc } = window.firebaseDB;
                        const snap = await getDoc(doc(db, 'orders', orderNumber));
                        if (snap.exists()) {
                            resolve(snap.data());
                        } else {
                            resolve(null);
                        }
                    } catch (error) {
                        console.error('Track error:', error);
                        resolve(null);
                    }
                });
            });
        }

        async function trackOrder() {
            const input = document.getElementById('orderNumberInput');
            const container = document.getElementById('resultContainer');
            let orderNumber = input.value.trim().toUpperCase();

            if (!orderNumber) {
                alert('Please enter your order number');
                return;
            }

            // Auto-add GENZ- prefix if user only entered numbers
            if (!orderNumber.startsWith('GENZ-')) {
                orderNumber = 'GENZ-' + orderNumber;
            }

            container.innerHTML = '<div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Searching your order...</div>';

            const order = await fetchOrderFromFirebase(orderNumber);

            if (!order) {
                container.innerHTML = `
                    <div class="not-found-box">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <h2>Order Not Found</h2>
                        <p>We couldn't find any order with number <strong>${orderNumber}</strong></p>
                        <p style="font-size:13px;">Please check your order number or contact us on WhatsApp.</p>
                        <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%2C%20mera%20order%20number%20${orderNumber}%20ka%20status%20check%20karna%20hai." 
                           target="_blank"
                           style="display:inline-flex; align-items:center; gap:8px; background:#25D366; color:white; text-decoration:none; padding:12px 25px; border-radius:8px; font-weight:700; margin-top:10px;">
                            <i class="fa-brands fa-whatsapp"></i> Contact on WhatsApp
                        </a>
                    </div>
                `;
                return;
            }

            renderOrder(order);
        }

        function renderOrder(order) {
            const container = document.getElementById('resultContainer');
            const status = order.status || 'Pending';
            const statusLower = status.toLowerCase();

            // Timeline logic
            const steps = ['Pending', 'Processing', 'Completed'];
            const currentIndex = steps.indexOf(status);

            let timelineHTML = '';
            steps.forEach(function(step, index) {
                let stepClass = '';
                let iconClass = '';

                if (status === 'Cancelled') {
                    stepClass = 'cancelled';
                    iconClass = 'fa-times';
                } else if (index < currentIndex) {
                    stepClass = 'completed';
                    iconClass = 'fa-check';
                } else if (index === currentIndex) {
                    stepClass = 'active';
                    iconClass = index === 0 ? 'fa-clock' : (index === 1 ? 'fa-box' : 'fa-check');
                } else {
                    iconClass = index === 0 ? 'fa-clock' : (index === 1 ? 'fa-box' : 'fa-check');
                }

                timelineHTML += `
                    <div class="timeline-step ${stepClass}">
                        <div class="timeline-icon"><i class="fa-solid ${iconClass}"></i></div>
                        <span>${step}</span>
                    </div>
                `;
            });

            // Progress bar
            let progressWidth = '0%';
            if (status === 'Completed') progressWidth = '80%';
            else if (status === 'Processing') progressWidth = '40%';
            else progressWidth = '0%';

            const dateStr = new Date(order.date).toLocaleString('en-PK', {
                day: 'numeric', month: 'long', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            const itemsHTML = order.items.map(function(item) {
                return `
                    <div class="item-row">
                        <span>${item.name} × ${item.quantity}</span>
                        <span>Rs. ${(item.price * item.quantity).toLocaleString()}</span>
                    </div>
                `;
            }).join('');

            const statusColor = {
                'Pending': '#f59e0b',
                'Processing': '#3b82f6',
                'Completed': '#22c55e',
                'Cancelled': '#dc2626'
            }[status] || '#7c3aed';

            container.innerHTML = `
                <div class="order-result">
                    <div class="order-result-header" style="background: linear-gradient(135deg, ${statusColor}, #06b6d4);">
                        <div class="order-info">
                            <h3>Order Number</h3>
                            <strong>${order.orderNumber}</strong>
                        </div>
                        <div class="status-pill">${status}</div>
                    </div>

                    <div class="order-result-body">

                        ${status !== 'Cancelled' ? `
                        <div class="status-timeline">
                            <div class="timeline-progress" style="width: ${progressWidth};"></div>
                            ${timelineHTML}
                        </div>
                        ` : `
                        <div style="text-align:center; padding:20px; background:#fee2e2; border-radius:12px; margin-bottom:20px;">
                            <i class="fa-solid fa-times-circle" style="font-size:40px; color:#dc2626; margin-bottom:10px;"></i>
                            <h3 style="color:#dc2626; margin-bottom:5px;">Order Cancelled</h3>
                            <p style="color:#991b1b; font-size:14px;">This order has been cancelled. Please contact us for more info.</p>
                        </div>
                        `}

                        <div class="detail-section">
                            <h4><i class="fa-solid fa-info-circle"></i> Order Information</h4>
                            <div class="detail-row">
                                <strong>Order Date</strong>
                                <span>${dateStr}</span>
                            </div>
                            <div class="detail-row">
                                <strong>Payment Method</strong>
                                <span style="text-transform: capitalize;">${order.payment}</span>
                            </div>
                            <div class="detail-row">
                                <strong>Current Status</strong>
                                <span style="color:${statusColor}; font-weight:800;">${status}</span>
                            </div>
                        </div>

                        <div class="detail-section">
                            <h4><i class="fa-solid fa-user"></i> Customer Details</h4>
                            <div class="detail-row">
                                <strong>Name</strong>
                                <span>${order.customer.name}</span>
                            </div>
                            <div class="detail-row">
                                <strong>Phone</strong>
                                <span>${order.customer.phone}</span>
                            </div>
                            <div class="detail-row">
                                <strong>City</strong>
                                <span>${order.customer.city}</span>
                            </div>
                            <div class="detail-row">
                                <strong>Address</strong>
                                <span style="max-width:60%;">${order.customer.address}</span>
                            </div>
                        </div>

                        <div class="detail-section">
                            <h4><i class="fa-solid fa-shopping-bag"></i> Order Items</h4>
                            ${itemsHTML}
                            <div class="total-row">
                                <span>Total</span>
                                <span>Rs. ${order.total.toLocaleString()}</span>
                            </div>
                        </div>

                        <div class="help-box">
                            <p>
                                <i class="fa-solid fa-headset"></i>
                                <strong>Koi sawal hai?</strong> Humse WhatsApp par rabta karein
                            </p>
                            <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%2C%20mera%20order%20number%20${order.orderNumber}%20ke%20baray%20mein%20poochna%20hai." 
                               target="_blank">
                                <i class="fa-brands fa-whatsapp"></i> Contact Us
                            </a>
                        </div>

                    </div>
                </div>
            `;
        }

        // Enter key to search
        document.getElementById('orderNumberInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') trackOrder();
        });

        // Auto-fill from URL
        document.addEventListener('DOMContentLoaded', function() {
            updateCartBadge();
            const params = new URLSearchParams(window.location.search);
            const orderNum = params.get('order');
            if (orderNum) {
                document.getElementById('orderNumberInput').value = orderNum;
                setTimeout(trackOrder, 500);
            }
        });
    </script>
</body>
</html>
