<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .checkout-section { padding: 40px 0 80px; min-height: 70vh; }
        .checkout-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
        .checkout-form {
            background: #fff; border-radius: 16px; padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
        }
        .checkout-form h2 { font-size: 24px; margin-bottom: 25px; color: #111827; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #1e293b; }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 15px; border: 1px solid #d1d5db;
            border-radius: 10px; font-size: 15px; background: #f8fafc;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .order-summary {
            background: #fff; border-radius: 16px; padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
            align-self: start; position: sticky; top: 100px;
        }
        .order-summary h2 { font-size: 24px; margin-bottom: 20px; color: #111827; }
        .order-items { max-height: 350px; overflow-y: auto; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .order-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .order-item:last-child { border-bottom: none; }
        .order-item-info { display: flex; align-items: center; gap: 12px; }
        .order-item-icon {
            width: 40px; height: 40px; border-radius: 10px; background: #f1f5f9;
            display: flex; align-items: center; justify-content: center; color: #7c3aed; font-size: 18px;
        }
        .order-item-name { font-weight: 500; font-size: 14px; }
        .order-item-name small { display: block; color: #94a3b8; font-size: 12px; font-weight: 400; }
        .order-item-price { font-weight: 700; color: #111827; }
        .order-totals { margin-top: 15px; }
        .order-totals > div { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; }
        .order-totals .total { border-top: 2px solid #e2e8f0; padding-top: 15px; margin-top: 5px; font-size: 20px; font-weight: 800; color: #111827; }
        .empty-cart { text-align: center; padding: 60px 20px; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; }
        .empty-cart i { font-size: 60px; color: #cbd5e1; margin-bottom: 20px; }
        .empty-cart h2 { margin-bottom: 10px; color: #1e293b; }
        .empty-cart p { color: #94a3b8; margin-bottom: 25px; }
        .place-order-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.35); }
        .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .payment-option {
            padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; text-align: center;
            cursor: pointer; transition: 0.3s; background: #f8fafc;
        }
        .payment-option:hover { border-color: #7c3aed; }
        .payment-option.selected { border-color: #7c3aed; background: #ede9fe; }
        .payment-option i { font-size: 24px; display: block; margin-bottom: 5px; }
        .payment-option span { font-size: 13px; font-weight: 600; }
        .payment-details {
            display: none; background: #f0fdf4; border: 2px solid #bbf7d0;
            border-radius: 12px; padding: 15px; margin-top: 12px;
        }
        .payment-details.show { display: block; }
        .payment-details h4 { color: #166534; margin-bottom: 10px; font-size: 14px; }
        .payment-details .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #bbf7d0;
        }
        .payment-details .detail-row:last-child { border-bottom: none; }
        .payment-details .detail-row strong { color: #166534; font-size: 13px; }
        .payment-details .detail-row span { color: #111827; font-weight: 600; font-size: 14px; }
        .copy-btn {
            background: #22c55e; color: white; border: none; padding: 4px 10px;
            border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;
        }
        .success-container {
            text-align: center; padding: 60px 20px; background: #fff;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
        }
        .success-container .check-icon {
            width: 80px; height: 80px; background: #dcfce7; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
        }
        .success-container .check-icon i { font-size: 40px; color: #16a34a; }
        .success-container h2 { color: #16a34a; margin-bottom: 10px; }
        .success-container p { color: #64748b; font-size: 18px; margin-bottom: 5px; }
        .success-container .order-number { color: #94a3b8; margin-bottom: 25px; }
        .success-container .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px; color: #111827;
            text-decoration: none; font-weight: 600; margin-bottom: 30px;
        }
        .primary-btn {
            display: inline-block; background: #111827; color: #fff; text-decoration: none;
            padding: 12px 25px; border-radius: 8px; font-weight: 600;
        }
        .primary-btn:hover { background: #7c3aed; }
        .whatsapp-btn { background: #25D366; color: white !important; }
        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; gap: 25px; }
            .checkout-form, .order-summary { padding: 25px; }
            .order-summary { position: static; }
            .form-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .payment-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">GEN.Z <span>GADGETS</span></a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search mobile accessories...">
                <button onclick="goToHomeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="nav-icons">
                <a href="#" title="Wishlist"><i class="fa-regular fa-heart"></i></a>
                <a href="cart.html" class="cart-icon" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </a>
                <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
        <nav id="mobileMenu" class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <section class="checkout-section">
        <div class="container">
            <a href="cart.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Cart
            </a>
            <div id="checkoutContent"></div>
        </div>
    </section>

    <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%20GEN.Z%20GADGETS%2C%20mujhe%20help%20chahiye."
       class="whatsapp-btn"
       target="_blank"
       style="position:fixed; right:20px; bottom:20px; z-index:9999; background:#25D366; color:white; height:55px; padding:0 20px; border-radius:50px; display:flex; align-items:center; gap:9px; font-weight:700; box-shadow:0 8px 25px rgba(37,211,102,0.35); text-decoration:none;">
        <i class="fa-brands fa-whatsapp" style="font-size:27px;"></i>
        <span>WhatsApp Us</span>
    </a>

    <!-- Firebase + Checkout JS -->
    <script type="module" src="js/firebase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/checkout.js"></script>

</body>
</html>
