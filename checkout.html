<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | GEN.Z GADGETS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .checkout-section { padding: 40px 0 80px; min-height: 70vh; }
        .checkout-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
        .checkout-form {
            background: #fff; border-radius: 16px; padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
        }
        .checkout-form h2 { font-size: 24px; margin-bottom: 25px; color: #111827; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #1e293b; }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 15px; border: 1px solid #d1d5db;
            border-radius: 10px; font-size: 15px; transition: border 0.3s; background: #f8fafc;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .order-summary {
            background: #fff; border-radius: 16px; padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
            align-self: start; position: sticky; top: 100px;
        }
        .order-summary h2 { font-size: 24px; margin-bottom: 20px; color: #111827; }
        .order-items { max-height: 350px; overflow-y: auto; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .order-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .order-item:last-child { border-bottom: none; }
        .order-item-info { display: flex; align-items: center; gap: 12px; }
        .order-item-icon {
            width: 40px; height: 40px; border-radius: 10px; background: #f1f5f9;
            display: flex; align-items: center; justify-content: center; color: #7c3aed; font-size: 18px;
        }
        .order-item-name { font-weight: 500; font-size: 14px; }
        .order-item-name small { display: block; color: #94a3b8; font-size: 12px; font-weight: 400; }
        .order-item-price { font-weight: 700; color: #111827; }
        .order-totals { margin-top: 15px; }
        .order-totals > div { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; }
        .order-totals .total { border-top: 2px solid #e2e8f0; padding-top: 15px; margin-top: 5px; font-size: 20px; font-weight: 800; color: #111827; }
        .empty-cart { text-align: center; padding: 60px 20px; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; }
        .empty-cart i { font-size: 60px; color: #cbd5e1; margin-bottom: 20px; }
        .empty-cart h2 { margin-bottom: 10px; color: #1e293b; }
        .empty-cart p { color: #94a3b8; margin-bottom: 25px; }
        .place-order-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.35); }
        .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .payment-option {
            padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; text-align: center;
            cursor: pointer; transition: 0.3s; background: #f8fafc;
        }
        .payment-option:hover { border-color: #7c3aed; }
        .payment-option.selected { border-color: #7c3aed; background: #ede9fe; }
        .payment-option i { font-size: 24px; display: block; margin-bottom: 5px; }
        .payment-option span { font-size: 13px; font-weight: 600; }
        .payment-details {
            display: none; background: #f0fdf4; border: 2px solid #bbf7d0;
            border-radius: 12px; padding: 15px; margin-top: 12px;
        }
        .payment-details.show { display: block; }
        .payment-details h4 { color: #166534; margin-bottom: 10px; font-size: 14px; }
        .payment-details .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #bbf7d0;
        }
        .payment-details .detail-row:last-child { border-bottom: none; }
        .payment-details .detail-row strong { color: #166534; font-size: 13px; }
        .payment-details .detail-row span { color: #111827; font-weight: 600; font-size: 14px; }
        .copy-btn {
            background: #22c55e; color: white; border: none; padding: 4px 10px;
            border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;
        }
        .copy-btn:active { background: #16a34a; }
        .success-container {
            text-align: center; padding: 60px 20px; background: #fff;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
        }
        .success-container .check-icon {
            width: 80px; height: 80px; background: #dcfce7; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
        }
        .success-container .check-icon i { font-size: 40px; color: #16a34a; }
        .success-container h2 { color: #16a34a; margin-bottom: 10px; }
        .success-container p { color: #64748b; font-size: 18px; margin-bottom: 5px; }
        .success-container .order-number { color: #94a3b8; margin-bottom: 25px; }
        .success-container .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px; color: #111827;
            text-decoration: none; font-weight: 600; margin-bottom: 30px;
        }
        .back-link:hover { color: #7c3aed; }
        .primary-btn {
            display: inline-block; background: #111827; color: #fff; text-decoration: none;
            padding: 12px 25px; border-radius: 8px; font-weight: 600; transition: 0.3s;
        }
        .primary-btn:hover { background: #7c3aed; transform: translateY(-2px); }
        .whatsapp-btn { background: #25D366; color: white; }
        .whatsapp-btn:hover { background: #1ebe5d; }
        .free-delivery-box {
            margin-top: 15px; padding: 15px; background: #f0fdf4;
            border-radius: 10px; border: 1px solid #bbf7d0;
        }
        .free-delivery-box p { font-size: 13px; color: #166534; margin: 0; }
        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; gap: 25px; }
            .checkout-form, .order-summary { padding: 25px; }
            .order-summary { position: static; }
            .form-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .payment-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">GEN.Z <span>GADGETS</span></a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search mobile accessories...">
                <button onclick="goToHomeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="nav-icons">
                <a href="#" title="Wishlist"><i class="fa-regular fa-heart"></i></a>
                <a href="checkout.html" class="cart-icon" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </a>
                <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
        <nav id="mobileMenu" class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <section class="checkout-section">
        <div class="container">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Store
            </a>
            <div id="checkoutContent"></div>
        </div>
    </section>

    <a href="https://wa.me/923197745919?text=Assalam-o-Alaikum%20GEN.Z%20GADGETS%2C%20mujhe%20help%20chahiye."
       class="whatsapp-btn"
       target="_blank"
       style="position:fixed; right:20px; bottom:20px; z-index:9999; background:#25D366; color:white; height:55px; padding:0 20px; border-radius:50px; display:flex; align-items:center; gap:9px; font-weight:700; box-shadow:0 8px 25px rgba(37,211,102,0.35); text-decoration:none;">
        <i class="fa-brands fa-whatsapp" style="font-size:27px;"></i>
        <span>WhatsApp Us</span>
    </a>

    <script>
        let cartItems = [];
        let selectedPayment = 'easypaisa';

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('genzCart')) || [];
            const totalItems = cart.reduce(function(sum, item) { return sum + item.quantity; }, 0);
            const cartElement = document.getElementById('cartCount');
            if (cartElement) cartElement.textContent = totalItems;
        }

        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            if (menu) menu.classList.toggle('active');
        }

        function goToHomeSearch() {
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) { window.location.href = 'index.html'; return; }
            const searchValue = searchInput.value.trim();
            if (!searchValue) { window.location.href = 'index.html'; return; }
            window.location.href = 'index.html?search=' + encodeURIComponent(searchValue);
        }

        function loadCheckout() {
            const container = document.getElementById('checkoutContent');
            if (!container) return;

            cartItems = JSON.parse(localStorage.getItem('genzCart')) || [];

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <h2>Your cart is empty</h2>
                        <p>Add some products to your cart before checking out.</p>
                        <a href="index.html" class="primary-btn">Continue Shopping</a>
                    </div>
                `;
                updateCartBadge();
                return;
            }

            const subtotal = cartItems.reduce(function(sum, item) { return sum + (item.price * item.quantity); }, 0);
            const deliveryFee = subtotal >= 9000 ? 0 : 350;
            const total = subtotal + deliveryFee;

            container.innerHTML = `
                <div class="checkout-container">
                    <div class="checkout-form">
                        <h2><i class="fa-solid fa-user"></i> Customer Details</h2>
                        <form id="checkoutForm">
                            <div class="form-group">
                                <label>Full Name <span class="required">*</span></label>
                                <input type="text" id="customerName" placeholder="e.g. Ahmed Khan" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Phone Number <span class="required">*</span></label>
                                    <input type="tel" id="customerPhone" placeholder="03XX-XXXXXXX" required>
                                </div>
                                <div class="form-group">
                                    <label>Email (Optional)</label>
                                    <input type="email" id="customerEmail" placeholder="ahmed@email.com">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Delivery Address <span class="required">*</span></label>
                                <textarea id="customerAddress" placeholder="House #, Street, City, Province" required></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>City <span class="required">*</span></label>
                                    <input type="text" id="customerCity" placeholder="e.g. Lahore" required>
                                </div>
                                <div class="form-group">
                                    <label>Delivery Instructions</label>
                                    <input type="text" id="deliveryInstructions" placeholder="Near mosque, landmark etc.">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Payment Method <span class="required">*</span></label>
                                <div class="payment-options">
                                    <div class="payment-option selected" data-payment="easypaisa" onclick="selectPayment('easypaisa')">
                                        <i class="fa-solid fa-mobile-screen" style="color:#00A859;"></i>
                                        <span>Easypaisa</span>
                                    </div>
                                    <div class="payment-option" data-payment="bank" onclick="selectPayment('bank')">
                                        <i class="fa-solid fa-building-columns" style="color:#1E3A8A;"></i>
                                        <span>UBL Bank</span>
                                    </div>
                                    <div class="payment-option" data-payment="jazzcash" onclick="selectPayment('jazzcash')">
                                        <i class="fa-solid fa-wallet" style="color:#ED1B24;"></i>
                                        <span>JazzCash</span>
                                    </div>
                                    <div class="payment-option" data-payment="cod" onclick="selectPayment('cod')">
                                        <i class="fa-solid fa-money-bill-wave" style="color:#f59e0b;"></i>
                                        <span>Cash on Delivery</span>
                                    </div>
                                </div>

                                <!-- Easypaisa Details -->
                                <div class="payment-details show" id="easypaisaDetails">
                                    <h4><i class="fa-solid fa-circle-info"></i> Easypaisa Payment Details</h4>
                                    <div class="detail-row">
                                        <strong>Account Number</strong>
                                        <span>0319-7745919 <button class="copy-btn" onclick="copyText('03197745919')">Copy</button></span>
                                    </div>
                                    <div class="detail-row">
                                        <strong>Account Name</strong>
                                        <span>Intisam Ali</span>
                                    </div>
                                    <p style="color:#166534; font-size:12px; margin-top:10px;">
                                        💡 Payment karne ke baad screenshot WhatsApp par bhejein: <strong>0319-7745919</strong>
                                    </p>
                                </div>

                                <!-- Bank Details -->
                                <div class="payment-details" id="bankDetails">
                                    <h4><i class="fa-solid fa-circle-info"></i> UBL Bank Payment Details</h4>
                                    <div class="detail-row">
                                        <strong>Bank Name</strong>
                                        <span>UBL (United Bank Limited)</span>
                                    </div>
                                    <div class="detail-row">
                                        <strong>Account Number</strong>
                                        <span>0620296738441 <button class="copy-btn" onclick="copyText('0620296738441')">Copy</button></span>
                                    </div>
                                    <div class="detail-row">
                                        <strong>Account Name</strong>
                                        <span>Intisam Ali</span>
                                    </div>
                                    <p style="color:#166534; font-size:12px; margin-top:10px;">
                                        💡 Transfer ke baad screenshot WhatsApp par bhejein: <strong>0319-7745919</strong>
                                    </p>
                                </div>

                                <!-- JazzCash Details -->
                                <div class="payment-details" id="jazzcashDetails">
                                    <h4><i class="fa-solid fa-circle-info"></i> JazzCash Payment Details</h4>
                                    <p style="color:#166534; font-size:13px;">
                                        JazzCash details jald update hongi. Filhal Easypaisa ya UBL Bank use karein. Ya WhatsApp par rabta karein: <strong>0319-7745919</strong>
                                    </p>
                                </div>

                                <!-- COD Details -->
                                <div class="payment-details" id="codDetails">
                                    <h4><i class="fa-solid fa-circle-info"></i> Cash on Delivery</h4>
                                    <p style="color:#166534; font-size:13px;">
                                        Cash on Delivery service <strong>filhal available nahi hai</strong>. Baraye meherbani Easypaisa ya UBL Bank use karein.
                                    </p>
                                </div>
                            </div>

                            <button type="submit" class="place-order-btn">
                                <i class="fa-solid fa-check"></i> Place Order
                            </button>
                        </form>
                    </div>

                    <div class="order-summary">
                        <h2><i class="fa-solid fa-receipt"></i> Order Summary</h2>
                        <div class="order-items">
                            ${cartItems.map(function(item) {
                                return '<div class="order-item">' +
                                    '<div class="order-item-info">' +
                                        '<div class="order-item-icon"><i class="fa-solid ' + (item.icon || 'fa-box') + '"></i></div>' +
                                        '<div class="order-item-name">' + item.name + '<small>Qty: ' + item.quantity + '</small></div>' +
                                    '</div>' +
                                    '<div class="order-item-price">Rs. ' + (item.price * item.quantity).toLocaleString() + '</div>' +
                                '</div>';
                            }).join('')}
                        </div>
                        <div class="order-totals">
                            <div><span>Subtotal</span><span>Rs. ${subtotal.toLocaleString()}</span></div>
                            <div><span>Delivery Fee</span><span>${deliveryFee === 0 ? '<span style="color:#16a34a; font-weight:700;">FREE</span>' : 'Rs. ' + deliveryFee.toLocaleString()}</span></div>
                            <div class="total"><span>Total</span><span>Rs. ${total.toLocaleString()}</span></div>
                        </div>
                        <div class="free-delivery-box">
                            <p>
                                <i class="fa-solid fa-truck"></i>
                                ${subtotal >= 9000 
                                    ? '✅ <strong>Free delivery applied (All over Pakistan)</strong>' 
                                    : '🚚 Free delivery on orders above <strong>Rs. 9,000</strong> — All over Pakistan'}
                            </p>
                        </div>
                    </div>
                </div>
            `;

            updateCartBadge();
            const form = document.getElementById('checkoutForm');
            if (form) form.addEventListener('submit', placeOrder);
        }

        function selectPayment(method) {
            selectedPayment = method;
            document.querySelectorAll('.payment-option').forEach(function(el) {
                el.classList.remove('selected');
            });
            document.querySelector('.payment-option[data-payment="' + method + '"]').classList.add('selected');

            document.querySelectorAll('.payment-details').forEach(function(el) {
                el.classList.remove('show');
            });
            const detailEl = document.getElementById(method + 'Details');
            if (detailEl) detailEl.classList.add('show');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('✅ Copied: ' + text);
            }).catch(function() {
                alert('Copy: ' + text);
            });
        }

        function placeOrder(event) {
            event.preventDefault();

            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const email = document.getElementById('customerEmail').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const city = document.getElementById('customerCity').value.trim();
            const instructions = document.getElementById('deliveryInstructions').value.trim();

            if (!name) { alert('Please enter your full name.'); return; }
            if (!phone || phone.length < 10) { alert('Please enter a valid phone number.'); return; }
            if (!address) { alert('Please enter your delivery address.'); return; }
            if (!city) { alert('Please enter your city.'); return; }

            if (selectedPayment === 'cod') {
                alert('Cash on Delivery filhal available nahi hai. Baraye meherbani Easypaisa ya UBL Bank select karein.');
                return;
            }

            const subtotal = cartItems.reduce(function(sum, item) { return sum + (item.price * item.quantity); }, 0);
            const deliveryFee = subtotal >= 9000 ? 0 : 350;
            const total = subtotal + deliveryFee;

            const order = {
                id: Date.now(),
                orderNumber: 'GENZ-' + Date.now().toString().slice(-8),
                date: new Date().toISOString(),
                customer: {
                    name: name, phone: phone, email: email || 'Not provided',
                    address: address, city: city, instructions: instructions || 'None'
                },
                items: cartItems.map(function(item) {
                    return { id: item.id, name: item.name, price: item.price, quantity: item.quantity, icon: item.icon || 'fa-box' };
                }),
                payment: selectedPayment,
                subtotal: subtotal,
                deliveryFee: deliveryFee,
                total: total,
                status: 'Pending'
            };

            let orders = JSON.parse(localStorage.getItem('genzOrders')) || [];
            orders.unshift(order);
            localStorage.setItem('genzOrders', JSON.stringify(orders));

            localStorage.removeItem('genzCart');
            updateCartBadge();
            showOrderSuccess(order);
            sendWhatsAppOrder(order);
        }

        function showOrderSuccess(order) {
            const container = document.getElementById('checkoutContent');
            const paymentLabel = {
                'easypaisa': 'Easypaisa',
                'bank': 'UBL Bank',
                'jazzcash': 'JazzCash',
                'cod': 'Cash on Delivery'
            }[order.payment] || order.payment;

            container.innerHTML = `
                <div class="success-container">
                    <div class="check-icon"><i class="fa-solid fa-check"></i></div>
                    <h2>Order Placed Successfully! 🎉</h2>
                    <p>Order #${order.orderNumber}</p>
                    <p class="order-number">Payment Method: <strong>${paymentLabel}</strong></p>
                    <p class="order-number">We will contact you shortly on <strong>${order.customer.phone}</strong></p>

                    ${order.payment === 'easypaisa' ? `
                        <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px; padding:15px; margin:20px auto; max-width:400px; text-align:left;">
                            <h4 style="color:#166534; margin-bottom:8px;">💳 Payment Instructions:</h4>
                            <p style="font-size:14px; color:#166534; margin:5px 0;">Send Rs. ${order.total.toLocaleString()} to:</p>
                            <p style="font-size:16px; color:#111827; font-weight:700; margin:5px 0;">Easypaisa: 0319-7745919</p>
                            <p style="font-size:14px; color:#166534; margin:5px 0;">Account Name: Intisam Ali</p>
                            <p style="font-size:13px; color:#166534; margin-top:10px;">📸 Screenshot WhatsApp par bhejein: <strong>0319-7745919</strong></p>
                        </div>
                    ` : ''}

                    ${order.payment === 'bank' ? `
                        <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px; padding:15px; margin:20px auto; max-width:400px; text-align:left;">
                            <h4 style="color:#166534; margin-bottom:8px;">🏦 Payment Instructions:</h4>
                            <p style="font-size:14px; color:#166534; margin:5px 0;">Transfer Rs. ${order.total.toLocaleString()} to:</p>
                            <p style="font-size:15px; color:#111827; font-weight:700; margin:5px 0;">UBL: 0620296738441</p>
                            <p style="font-size:14px; color:#166534; margin:5px 0;">Account Name: Intisam Ali</p>
                            <p style="font-size:13px; color:#166534; margin-top:10px;">📸 Screenshot WhatsApp par bhejein: <strong>0319-7745919</strong></p>
                        </div>
                    ` : ''}

                    ${order.payment === 'jazzcash' ? `
                        <div style="background:#fef3c7; border:1px solid #fcd34d; border-radius:12px; padding:15px; margin:20px auto; max-width:400px; text-align:left;">
                            <h4 style="color:#92400e; margin-bottom:8px;">⚠️ JazzCash Payment:</h4>
                            <p style="font-size:14px; color:#92400e; margin:5px 0;">JazzCash details filhal update ho rahi hain.</p>
                            <p style="font-size:14px; color:#92400e; margin:5px 0;">Baraye meherbani WhatsApp par rabta karein:</p>

            const message = '📦 *New Order Received!*%0A%0A' +
                '🔢 Order #: ' + order.orderNumber + '%0A' +
                '📅 Date: ' + new Date(order.date).toLocaleDateString('en-PK') + '%0A%0A' +
                '👤 *Customer Details*%0A' +

                '💰 *Subtotal: Rs. ' + order.subtotal.toLocaleString() + '*%0A' +
                '🚚 *Delivery: ' + (order.deliveryFee === 0 ? 'FREE' : 'Rs. ' + order.deliveryFee.toLocaleString()) + '*%0A' +
                '💵 *Total: Rs. ' + order.total.toLocaleString() + '*%0A' +
                '💳 Payment: ' + (paymentLabels[order.payment] || order.payment) + '%0A%0A' +
                '✅ Please confirm order.';

            const whatsappUrl = 'https://wa.me/923197745919?text=' + message;

            setTimeout(function() {
